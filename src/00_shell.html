<title>Dark Days Chronicles</title>
<meta name="theme-color" content="#121016">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya:ital,wght@0,400;0,600;1,400&family=Alegreya+Sans:wght@500;700&display=swap">
<style>
/* Layout: one-screen portrait game shell — scene art over prose and numbered CRPG dialogue; combat is a 7×9 tactical board over an action tray. Single dark world under the Black Sun. */
:root{
  --ink:#121016; --ash:#1b1720; --stone:#27212d; --line:#3a3242;
  --bone:#ebe1cc; --muted:#a69a86; --brass:#caa650; --brass-dim:#87703a;
  --ember:#e0703f; --blood:#b8344d; --frost:#86a4da; --moss:#7db384; --violet:#a07ad6;
  --f-display:'IM Fell English SC','Iowan Old Style',Georgia,serif;
  --f-body:'Alegreya',Georgia,'Times New Roman',serif;
  --f-ui:'Alegreya Sans','Segoe UI',Roboto,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--bone);font:17px/1.5 var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
#app{position:relative;height:100%;max-width:560px;margin:0 auto;overflow:hidden;background:var(--ink)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.lbl{font-family:var(--f-ui);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.btn{display:block;width:100%;padding:12px 16px;border:1px solid var(--brass-dim);background:linear-gradient(#2a2219,#1c1712);border-radius:8px;font-family:var(--f-display);font-size:20px;letter-spacing:.03em;color:var(--bone);text-align:center}
.btn.primary{border-color:var(--brass);color:#1b140a;background:linear-gradient(#e2c26e,#b78f3a)}
.btn.small{font-size:16px;padding:9px 12px}
.btn:disabled{opacity:.4;cursor:default}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:0;padding:8px 6px;border:1px solid var(--line);background:var(--ash);border-radius:6px;font-family:var(--f-ui);font-size:14px;letter-spacing:.03em;color:var(--muted)}
.seg button[aria-pressed=true]{border-color:var(--brass);color:var(--brass);background:#241e17}
svg.ic{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- title ---------- */
#title canvas{position:absolute;inset:0;width:100%;height:100%}
.title-inner{position:relative;margin-top:auto;padding:40px 16px 26px;display:flex;flex-direction:column;gap:14px;background:linear-gradient(rgba(18,16,22,0),var(--ink) 34%)}
.logo{font-family:var(--f-display);font-weight:400;font-size:clamp(42px,13vw,64px);line-height:.92;margin:0;text-wrap:balance}
.logo small{display:block;font-size:.42em;color:var(--brass);letter-spacing:.32em;margin-bottom:6px}
.tag{font-style:italic;color:var(--muted);margin:0}
.foot{font-family:var(--f-ui);font-size:12px;color:var(--muted);text-align:center;margin:2px 0 0}

/* ---------- creation ---------- */
#create .top{padding:12px 16px 8px;border-bottom:1px solid var(--line);background:var(--ash)}
#create h1{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0}
.steps{display:flex;gap:4px;margin-top:8px}
.steps i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--brass)}
.scroll{flex:1;overflow-y:auto;padding:16px 16px 24px;-webkit-overflow-scrolling:touch;min-height:0}
.navbar{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--line);background:var(--ash)}
.navbar .btn{flex:1}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:start;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--ash)}
.opt[aria-pressed=true]{border-color:var(--brass);background:#221c16}
.opt .oi{width:40px;height:40px;border-radius:50%;background:var(--stone);color:var(--brass);padding:8px}
.opt b{font-family:var(--f-display);font-weight:400;font-size:19px;display:block}
.opt span{font-size:14px;color:var(--muted);display:block;line-height:1.35}
.opt em{font-style:normal;font-family:var(--f-ui);font-size:12px;color:var(--frost);display:block;margin-top:3px}
.namein{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--ash);font-family:var(--f-display);font-size:20px;margin:6px 0 18px}
.pb{display:grid;gap:6px}
.pbrow{display:grid;grid-template-columns:1fr 36px 34px 36px 52px;gap:6px;align-items:center;padding:6px 10px;border-radius:8px;background:var(--ash);font-variant-numeric:tabular-nums}
.pbrow b{font-family:var(--f-ui);font-weight:700;font-size:14px;letter-spacing:.06em}
.pbrow b small{display:block;font-weight:500;color:var(--muted);letter-spacing:0;font-size:12px}
.pbrow button{height:34px;border:1px solid var(--line);border-radius:6px;background:var(--stone);font-size:20px;line-height:1}
.pbrow .v{text-align:center;font-family:var(--f-display);font-size:20px}
.pbrow .f{text-align:right;font-family:var(--f-ui);font-size:13px;color:var(--brass)}
.pts{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;flex-wrap:wrap}
.pts strong{font-family:var(--f-display);font-size:22px;color:var(--brass);font-weight:400}
.sumgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.stat{padding:8px;border-radius:8px;background:var(--ash);text-align:center;font-variant-numeric:tabular-nums}
.stat b{display:block;font-family:var(--f-display);font-size:22px;font-weight:400}
.stat span{font-family:var(--f-ui);font-size:11px;letter-spacing:.12em;color:var(--muted)}
.plist{font-size:15px;color:var(--muted);margin:4px 0 12px}
.plist b{color:var(--bone);font-weight:600}

/* ---------- story ---------- */
.hud{display:flex;gap:8px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--ash);flex:none}
.chips{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.chip{display:flex;align-items:center;gap:6px;flex:none;padding:3px 9px 3px 3px;border-radius:20px;background:var(--stone);font-family:var(--f-ui);font-size:12px;line-height:1.1}
.pt{width:28px;height:28px;border-radius:50%;padding:5px;flex:none;color:var(--brass);background:#2c2434;border:1px solid var(--brass-dim)}
.bar{height:4px;background:#000;border-radius:2px;overflow:hidden;width:46px;margin-top:3px}
.bar i{display:block;height:100%;background:var(--moss)}
.bar i.lo{background:var(--blood)}
.gold{font-family:var(--f-ui);font-size:13px;color:var(--brass);flex:none;font-variant-numeric:tabular-nums}
.iconbtn{width:40px;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--stone);padding:9px;flex:none;color:var(--bone)}
.art{position:relative;flex:none;border-bottom:1px solid var(--line)}
.art canvas{display:block;width:100%;height:clamp(140px,29vh,250px)}
.art .loc{position:absolute;left:16px;bottom:9px;right:16px;font-family:var(--f-ui);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass);text-shadow:0 1px 6px #000}
.prose{animation:fadeIn .45s ease}
.prose p{margin:0 0 .8em;max-width:65ch}
.prose p:first-child::first-letter{font-family:var(--f-display);font-size:2.7em;float:left;line-height:.78;padding:7px 7px 0 0;color:var(--brass)}
.prose .act-card{font-family:var(--f-display);font-size:22px;color:var(--brass);letter-spacing:.04em;text-wrap:balance}
.prose p.act-card::first-letter{font-size:1em;float:none;padding:0;color:inherit}
.choices{display:flex;flex-direction:column;gap:7px;margin-top:16px}
.choice{display:grid;grid-template-columns:22px 1fr;gap:4px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--ash);font-size:16px;line-height:1.35;transition:background .15s,border-color .15s}
.choice:active,.choice:hover{border-color:var(--brass-dim);background:#211b24}
.choice .n{color:var(--brass);font-family:var(--f-display)}
.choice:disabled{opacity:.45}
.tg{display:inline-block;font-family:var(--f-ui);font-size:12px;letter-spacing:.04em;padding:0 7px;border:1px solid var(--frost);color:var(--frost);border-radius:10px;margin-left:4px;white-space:nowrap;vertical-align:1px}
.tg.f{border-color:var(--blood);color:#e8849a}
.tg.c{border-color:var(--brass);color:var(--brass)}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- modal / sheets ---------- */
.modal{position:absolute;inset:0;background:rgba(6,4,9,.8);display:flex;align-items:flex-end;justify-content:center;z-index:30;animation:fadeIn .2s}
.modal.center{align-items:center;padding:16px}
.sheet{width:100%;max-height:90%;overflow-y:auto;background:var(--ash);border-top:1px solid var(--brass-dim);border-radius:14px 14px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.modal.center .sheet{border:1px solid var(--brass-dim);border-radius:14px;max-width:420px}
.sheet h2{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0 0 8px;text-wrap:balance}
.sheet h3{font-family:var(--f-ui);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px;font-weight:700}
.sheet p{margin:0 0 10px}
.tabs{display:flex;gap:4px;margin:-4px 0 12px;overflow-x:auto}
.tabs button{flex:1;padding:8px 6px;border-bottom:2px solid transparent;font-family:var(--f-ui);font-size:14px;color:var(--muted);white-space:nowrap}
.tabs button[aria-pressed=true]{border-color:var(--brass);color:var(--bone)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{min-width:0;flex:1}
.row .t b{font-weight:600}
.row .t small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.row .btn{width:auto;flex:none}
.abgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;font-variant-numeric:tabular-nums}
.abgrid div{background:var(--stone);border-radius:6px;padding:5px 2px;text-align:center}
.abgrid b{display:block;font-family:var(--f-display);font-size:18px;font-weight:400}
.abgrid span{font-family:var(--f-ui);font-size:10px;letter-spacing:.1em;color:var(--muted)}
.abgrid small{display:block;font-family:var(--f-ui);font-size:12px;color:var(--brass)}
.taglist{display:flex;flex-wrap:wrap;gap:5px}
.taglist span{font-family:var(--f-ui);font-size:13px;padding:2px 8px;border-radius:10px;background:var(--stone)}
.who{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.who button{padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--stone);font-family:var(--f-ui);font-size:14px}
.qst{padding:10px 0;border-bottom:1px solid var(--line)}
.qst b{font-family:var(--f-display);font-weight:400;font-size:19px}
.qst small{font-family:var(--f-ui);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-left:6px;color:var(--frost)}
.qst.done small{color:var(--moss)}
.qst p{font-size:15px;color:var(--muted);margin:3px 0 0}
.dice{text-align:center;padding:6px 0}
.d20{width:96px;height:96px;margin:6px auto 10px;display:grid;place-items:center;font-family:var(--f-display);font-size:44px;color:var(--bone);background:radial-gradient(circle at 40% 35%,#3a3044,#1d1822);clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);font-variant-numeric:tabular-nums}
.d20.roll{animation:spin .7s ease-out}
@keyframes spin{from{transform:rotate(-200deg) scale(.6)}to{transform:none}}
.dice .math{font-family:var(--f-ui);font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.dice .res{font-family:var(--f-display);font-size:28px;margin:6px 0 12px}
.res.ok{color:var(--moss)} .res.ko{color:#e8849a}
.toast{top:calc(62px + env(safe-area-inset-top,0px));bottom:auto!important}
#app.incb .toast{top:calc(64px + env(safe-area-inset-top,0px))}
.toast{position:absolute;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;padding:10px 14px;border-radius:8px;background:#2b2431;border:1px solid var(--brass-dim);font-family:var(--f-ui);font-size:14px;text-align:center;animation:fadeIn .2s;pointer-events:none}


/* ---------- polish: shared ornaments & medallions ---------- */
.med{display:inline-grid;place-items:center;flex:none;width:44px;height:44px;border-radius:50%;padding:10px;color:#f7ead0;background:radial-gradient(circle at 34% 26%,#6b5a86,#2c2239 50%,#120d18);box-shadow:inset 0 0 0 1.5px #ffe3a0,inset 0 0 0 3.5px #8c6a2c,inset 0 0 0 4.5px #2a1d0c,inset 0 -5px 8px rgba(0,0,0,.6),0 3px 8px rgba(0,0,0,.65)}
.med svg{width:100%;height:100%;filter:drop-shadow(0 0 3px rgba(255,214,140,.55))}
.med.sm{width:30px;height:30px;padding:7px}
.med.big{width:56px;height:56px;padding:13px}
.med.on{box-shadow:inset 0 0 0 1.5px #fff1c9,inset 0 0 0 3.5px #caa650,inset 0 0 0 4.5px #2a1d0c,0 0 16px rgba(240,200,120,.55),0 3px 8px rgba(0,0,0,.65)}
.orn{display:flex;align-items:center;gap:10px;color:var(--brass);margin:2px 0}
.orn i{flex:1;height:1px;background:linear-gradient(90deg,transparent,#8a6d34 30%,#e2c26e 50%,#8a6d34 70%,transparent)}
.orn svg{width:18px;height:18px;filter:drop-shadow(0 0 4px rgba(240,200,120,.6))}
.orn b{width:7px;height:7px;transform:rotate(45deg);background:#caa650;box-shadow:0 0 6px rgba(240,200,120,.7)}
.orn.sm{margin:20px 0 4px}
.btn{position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 3px 8px rgba(0,0,0,.45);transition:transform .1s,box-shadow .2s}
.btn:active{transform:translateY(1px)}
.btn.primary{box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 0 0 1px #6d5524,0 4px 14px rgba(0,0,0,.5),0 0 22px rgba(240,200,120,.25)}
.btn.big{padding:14px 16px;font-size:22px}
.btn.big small{display:block;font-family:var(--f-ui);font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.75;margin-bottom:2px}
/* title */
#title{background:#060509}
.title-inner{gap:12px;padding:40px 16px 22px;background:linear-gradient(rgba(6,5,9,0),rgba(6,5,9,.86) 22%,#060509 46%)}
.logo{line-height:.9;text-align:center}
.logo .lg1{display:block;font-size:clamp(46px,14.5vw,70px);background:linear-gradient(#fff6dc 10%,#e9c876 48%,#9a7634 75%,#e9c876);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #000) drop-shadow(0 0 18px rgba(240,190,100,.35))}
.logo .lg2{display:block;font-size:clamp(16px,5vw,22px);letter-spacing:.55em;padding-left:.55em;color:#caa650;margin-top:8px}
.tag{text-align:center;font-size:18px}
.tgrid{display:grid;gap:10px}
.tgrid .lbl{margin-bottom:6px}
/* creation */
#create .top{background:linear-gradient(#1f1925,#16111a);box-shadow:0 1px 0 rgba(202,166,80,.15)}
.hero{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.hero b{display:block;font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.1;color:#f3e2b4}
.hero span{font-family:var(--f-ui);font-size:12px;color:var(--muted)}
#create h1{font-size:13px;font-family:var(--f-ui);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.opt{grid-template-columns:44px 1fr;gap:12px;padding:12px;background:linear-gradient(#211a27,#18131c);box-shadow:inset 0 1px 0 rgba(255,255,255,.04);transition:border-color .2s,box-shadow .2s}
.opt[aria-pressed=true]{border-color:#caa650;background:linear-gradient(#2c2219,#1b150f);box-shadow:0 0 0 1px #caa650,0 0 18px rgba(240,200,120,.18)}
.opt b{font-size:20px;color:#f3e2b4}
.pbrow{background:linear-gradient(#211a27,#18131c);box-shadow:inset 0 0 0 1px #2f2736}
.pbrow button{background:linear-gradient(#352c3f,#1f1925);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
/* story */
.hud{background:linear-gradient(#1c1621,#141017);box-shadow:0 1px 0 rgba(202,166,80,.14);z-index:2;position:relative}
.chip{gap:7px;padding:2px 10px 2px 2px;background:rgba(36,29,43,.7);box-shadow:inset 0 0 0 1px #33293b;border-radius:22px}
.pmed{position:relative;width:36px;height:36px;display:grid;place-items:center}
.pmed .pring{position:absolute;inset:0;transform:rotate(-90deg)}
.pring circle{fill:none;stroke-width:7}
.pring .trk{stroke:rgba(0,0,0,.6)} .pring .hp{stroke:#7fd18f;stroke-dasharray:283;stroke-linecap:round}
.pmed.lo .pring .hp{stroke:#ffb347}
.chip .cn{display:grid;line-height:1.1;font-size:12px}
.chip .cn small{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.gold{display:flex;align-items:center;gap:4px;font-weight:700}
.gold svg{width:16px;height:16px}
.story-scroll{padding:0}
.story-scroll .art{border-bottom:0}
.story-scroll .art canvas{height:clamp(170px,32vh,280px)}
.story-scroll .art::after{content:"";position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(rgba(18,16,22,0),var(--ink));pointer-events:none}
.art .loc{z-index:1;display:flex;justify-content:center;bottom:6px}
.art .loc span{padding:4px 14px;border-radius:14px;background:rgba(10,8,12,.72);box-shadow:inset 0 0 0 1px rgba(202,166,80,.45);backdrop-filter:blur(2px);letter-spacing:.22em}
.pagebody{padding:10px 16px 28px}
.actcard{margin:4px 0 16px;text-align:center}
.actcard p{margin:10px 0!important;font-family:var(--f-display);font-size:22px;line-height:1.25;color:#f3e2b4;text-shadow:0 0 16px rgba(240,200,120,.35);text-wrap:balance}
.actcard p::first-letter{font-size:1em!important;float:none!important;padding:0!important;color:inherit!important}
.prose .actcard + p::first-letter{font-family:var(--f-display);font-size:2.7em;float:left;line-height:.78;padding:7px 7px 0 0;color:var(--brass)}
.choice{grid-template-columns:28px 1fr 20px;align-items:center;gap:10px;padding:11px 12px;border:0;border-radius:8px;background:linear-gradient(#221b28,#18131c);box-shadow:inset 0 0 0 1px #3a3044,inset 0 1px 0 rgba(255,255,255,.05),0 2px 6px rgba(0,0,0,.35)}
.choice:hover,.choice:active{background:linear-gradient(#2d2333,#1d1720);box-shadow:inset 0 0 0 1px #8a6d34,0 0 14px rgba(240,200,120,.15)}
.choice .n{display:grid;place-items:center;width:26px;height:26px;transform:rotate(45deg);border-radius:4px;background:linear-gradient(135deg,#3a2e1a,#1b140c);box-shadow:inset 0 0 0 1px #caa650;font-family:var(--f-display);font-size:14px;color:#f0d48a}
.choice .n{text-indent:0}
.choice .n::before{content:"";}
.choice .ct{min-width:0}
.choice .ci{width:20px;height:20px;color:#8a7a66}
.choice.k-swords .ci{color:#e8849a} .choice.k-d20 .ci{color:#9fb6e8} .choice.k-coin .ci,.choice.k-moon .ci{color:#caa650}
.choice.k-swords{box-shadow:inset 0 0 0 1px #5a2632,inset 0 1px 0 rgba(255,255,255,.05),0 2px 6px rgba(0,0,0,.35)}
/* number inside the rotated diamond stays upright */
.choice .n{font-size:0}
.choice .n::after{content:attr(data-n);font-size:14px;transform:rotate(-45deg)}
/* dice */
.dice .dc{font-family:var(--f-ui);font-size:12px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.dice .dc b{font-family:var(--f-display);font-size:20px;color:#f3e2b4;letter-spacing:0}
.d20wrap{width:140px;height:140px;margin:6px auto 4px}
.d20s{width:100%;height:100%;overflow:visible}
.d20s .edge{stroke:#caa650;stroke-width:2}
.d20s .f{fill:rgba(255,255,255,.035)} .d20s .f1{fill:rgba(255,255,255,.07)}
.d20s .ln{fill:none;stroke:rgba(202,166,80,.55);stroke-width:1.2}
.d20s .num{font-family:var(--f-display);font-size:34px;fill:#f7ead0}
.d20s.rolling{animation:tumble .9s cubic-bezier(.2,.7,.3,1)}
@keyframes tumble{0%{transform:rotate(-540deg) scale(.4);opacity:0}60%{transform:rotate(20deg) scale(1.08);opacity:1}100%{transform:rotate(0) scale(1)}}
