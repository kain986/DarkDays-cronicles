  t:()=>cat(["Kael lancia sassi nel buio. «Da bambini, io e Doran rubavamo il pane al fornaio del Ponte Vecchio. Lui era quello che si sentiva in colpa e tornava a pagare.»","Kael tosses pebbles into the dark. “As kids, Doran and I used to steal bread from the baker on the Old Bridge. He was the one who felt guilty and went back to pay.”","Kael lanza piedras a la oscuridad. «De niños, Doran y yo robábamos pan al panadero del Puente Viejo. Él era el que se sentía culpable y volvía a pagar.»"],
    has("doran_ally") ? ["«Domani mi guarderà le spalle. Come allora.»","“Tomorrow he'll watch my back. Like back then.”","«Mañana me cubrirá las espaldas. Como entonces.»"] :
    has("doran_dead") ? ["«Spero che dove si trova adesso faccia caldo. E che ci sia pane.»","“I hope wherever he is now, it's warm. And there's bread.”","«Espero que donde esté ahora haga calor. Y que haya pan.»"] :
    ["«Non so dove sia adesso. Spero solo che non sia lassù.»","“I don't know where he is now. I just hope he's not up there.”","«No sé dónde está ahora. Solo espero que no esté allí arriba.»"],
    ["Ti dà una gomitata. «Comunque, se sopravviviamo, offri tu.»","He nudges you. “Anyway, if we survive, drinks are on you.”","Te da un codazo. «En fin, si sobrevivimos, invitas tú.»"]),
  ch:[{t:["Continuare","Go on","Continuar"], go:"a3_camp"}]};
SC.a3_t_ilyra = {bg:"camp", loc:LOC.camp, once(){ set("t_ilyra"); set("shatter_known"); xp(50); },
  t:["Ilyra, per una volta, non legge. «Ho studiato per trecento anni. Ho letto di dèi, di soli, di fini del mondo. Ma non avevo mai avuto paura di un libro.»\n\nGuarda il tuo marchio. «C'è un'altra possibilità, domani. La Chiave potrebbe non riaccendere il sole, ma spezzare tutto: il marchio, il sigillo, il legame tra il sole e gli dèi. Non so cosa resterebbe. Forse solo un cielo normale, che non appartiene a nessuno.» Sorride appena. «Pensaci.»","For once, Ilyra isn't reading. “I've studied for three hundred years. I've read of gods, of suns, of the ends of worlds. But I'd never been afraid of a book.”\n\nShe looks at your mark. “There's another possibility, tomorrow. The Key might not relight the sun, but break everything: the mark, the seal, the bond between the sun and the gods. I don't know what would remain. Perhaps just an ordinary sky, belonging to no one.” She smiles faintly. “Think about it.”","Ilyra, por una vez, no lee. «He estudiado durante trescientos años. He leído sobre dioses, soles, fines del mundo. Pero nunca había tenido miedo de un libro.»\n\nMira tu marca. «Mañana hay otra posibilidad. La Llave podría no reavivar el sol, sino romperlo todo: la marca, el sello, el vínculo entre el sol y los dioses. No sé qué quedaría. Quizá solo un cielo normal, que no pertenece a nadie.» Sonríe apenas. «Piénsalo.»"],
  ch:[{t:["Continuare","Go on","Continuar"], go:"a3_camp"}]};

SC.a3_gate = {bg:"fortress", loc:LOC.fort,
  t:()=>cat(["La fortezza della Corona di Cenere: mura nere, torri storte come dita rotte. All'orizzonte il Sole Nero è così basso che sembra posarsi sul picco.","The fortress of the Crown of Ash: black walls, towers crooked as broken fingers. On the horizon the Black Sun hangs so low it seems to rest on the peak.","La fortaleza de la Corona de Ceniza: murallas negras, torres torcidas como dedos rotos. En el horizonte el Sol Negro está tan bajo que parece posarse sobre el pico."],
    has("guard_ally") && ["Un corno: la guardia di Vesperia carica la porta principale. La fortezza si riempie di allarmi.","A horn: the guard of Vesperia charges the main gate. The fortress fills with alarms.","Un cuerno: la guardia de Vesperia carga contra la puerta principal. La fortaleza se llena de alarmas."],
    beacons() && ["Sulle colline a sud si accendono fuochi, uno dopo l'altro: Ashford. I cultisti sulle mura si coprono gli occhi.","On the hills to the south fires kindle, one after another: Ashford. The cultists on the walls shield their eyes.","En las colinas del sur se encienden hogueras, una tras otra: Ashford. Los sectarios de las murallas se cubren los ojos."],
    has("mira_ally") && ["Le frecce di Mira Benda abbattono le sentinelle delle torri.","Mira Patch's arrows bring down the tower sentries.","Las flechas de Mira Parche abaten a los centinelas de las torres."]),
  ch:[
    {t:["Seguire Doran nelle cisterne","Follow Doran into the cisterns","Seguir a Doran por las cisternas"], req:()=>has("doran_ally"), fx(){ xp(600); }, go:"a3_halls"},
    {t:["Usare la mappa di Doran per entrare dalle cisterne","Use Doran's map to enter through the cisterns","Usar el mapa de Doran para entrar por las cisternas"], req:()=>has("doran_dead"), fight:"cistern", win:"a3_halls"},
    {t:["Assaltare la porta laterale","Storm the side gate","Asaltar la puerta lateral"], fight:()=> (has("guard_ally")||beacons()||has("mira_ally")) ? "gate_easy" : "gate", win:"a3_halls"}]};

SC.a3_halls = {bg:"mirror", loc:LOC.halls,
  t:["La Sala degli Specchi. Pareti di ossidiana lucida riflettono le vostre figure, ma i riflessi non si muovono come voi. Nel tuo, il marchio è un sole nero che ti divora il braccio. Il riflesso sorride.\n\nPoi esce dallo specchio.","The Hall of Mirrors. Walls of polished obsidian reflect your figures, but the reflections don't move as you do. In yours, the mark is a black sun devouring your arm. The reflection smiles.\n\nThen it steps out of the mirror.","La Sala de los Espejos. Paredes de obsidiana pulida reflejan vuestras figuras, pero los reflejos no se mueven como vosotros. En el tuyo, la marca es un sol negro que te devora el brazo. El reflejo sonríe.\n\nLuego sale del espejo."],
  ch:[{t:["Resistere alla visione","Resist the vision","Resistir la visión"], check:{save:"wis", dc:13, ok:"a3_halls_ok", ko:"a3_halls_ko"}}]};
SC.a3_halls_ok = {bg:"mirror", loc:LOC.halls,
  t:["Chiudi gli occhi. Pensi a Liesel, a Tam, al disegno del sole giallo sul muro del pozzo. Quando li riapri, il tuo riflesso è solo un'ombra confusa. Ma gli altri riflessi vi stanno già circondando.","You close your eyes. You think of Liesel, of Tam, of the yellow sun drawn on the well wall. When you open them, your reflection is only a blurred shadow. But the other reflections are already surrounding you.","Cierras los ojos. Piensas en Liesel, en Tam, en el sol amarillo dibujado en el muro del pozo. Cuando los abres, tu reflejo es solo una sombra borrosa. Pero los otros reflejos ya os rodean."],
  ch:[{t:["Combattere","Fight","Luchar"], fight:"mirror_easy", win:"a3_prison"}]};
SC.a3_halls_ko = {bg:"mirror", loc:LOC.halls, once(){ dmgParty(6); },
  t:["La visione ti trascina dentro: per un istante sei il dio, e hai fame. Quando torni in te sei in ginocchio, e sanguini dal naso. Le ombre dei vostri riflessi vi circondano.","The vision drags you in: for an instant you are the god, and you are hungry. When you come to, you're on your knees, bleeding from the nose. The shadows of your reflections surround you.","La visión te arrastra dentro: por un instante eres el dios, y tienes hambre. Cuando vuelves en ti estás de rodillas, sangrando por la nariz. Las sombras de vuestros reflejos os rodean."],
  ch:[{t:["Combattere","Fight","Luchar"], fight:"mirror", win:"a3_prison"}]};

SC.a3_prison = {bg:"dungeon", loc:LOC.prison,
  t:["Le prigioni. Sei persone incatenate a colonne di pietra, ognuna con un marchio sul dorso della mano: un vecchio, una ragazza, un fabbro, una monaca, due gemelli. I loro marchi sono spenti e grigi: la fortezza ne sta già bevendo la luce.\n\nCarcerieri con maschere di ferro si voltano verso di voi.","The cells. Six people chained to stone pillars, each with a mark on the back of their hand: an old man, a girl, a smith, a nun, two twins. Their marks are dull and grey: the fortress is already drinking their light.\n\nJailers in iron masks turn toward you.","Las celdas. Seis personas encadenadas a columnas de piedra, cada una con una marca en el dorso de la mano: un anciano, una muchacha, un herrero, una monja, dos gemelos. Sus marcas están apagadas y grises: la fortaleza ya está bebiendo su luz.\n\nCarceleros con máscaras de hierro se vuelven hacia vosotros."],
  ch:[{t:["Combattere","Fight","Luchar"], fight:"jailers", win:"a3_prison_won"}]};
SC.a3_prison_won = {bg:"dungeon", loc:LOC.prison, once(){ set("freed_branded"); xp(200); },
  t:["Liberate i sei marchiati. Le catene sono fredde come il ghiaccio. La ragazza ti stringe la mano marchiata, e per un istante i vostri marchi brillano insieme di luce dorata.\n\n«Siamo con te» dice. «Qualunque cosa deciderai lassù, la nostra luce è anche tua.»","You free the six marked. The chains are cold as ice. The girl grips your marked hand, and for an instant your marks shine together with golden light.\n\n“We're with you,” she says. “Whatever you decide up there, our light is yours too.”","Liberáis a los seis marcados. Las cadenas están frías como el hielo. La muchacha te aprieta la mano marcada, y por un instante vuestras marcas brillan juntas con luz dorada.\n\n«Estamos contigo» dice. «Decidas lo que decidas allí arriba, nuestra luz también es tuya.»"],
  ch:[
    {t:["Bere una pozione e riprendere fiato","Catch your breath","Recobrar el aliento"], req:()=>!has("prison_rest"), fx(){ set("prison_rest"); S.party.forEach(c=>{ c.hp=Math.min(c.maxhp, c.hp+Math.ceil(c.maxhp/2)); }); toastQ(["Il gruppo recupera metà dei punti ferita.","The party recovers half its hit points.","El grupo recupera la mitad de sus puntos de golpe."]); }, go:"a3_prison_won"},
    {t:["Salire alla sala del trono","Climb to the throne room","Subir al salón del trono"], go:"a3_throne"}]};

SC.a3_throne = {bg:"throne", loc:LOC.throne,
  t:["La sala del trono è aperta sul cielo. Sopra di voi il Sole Nero riempie metà del firmamento, e al suo interno qualcosa si muove: una bocca.\n\nDavanti all'altare, Seraphine tiene la Chiave dell'Alba. Non porta più il velo. «Sei venuto.» La sua voce è quasi tenera. «Sapevo che saresti venuto. Sei buono, come lo era lei.»","The throne room lies open to the sky. Above you the Black Sun fills half the heavens, and within it something moves: a mouth.\n\nBefore the altar, Seraphine holds the Key of Dawn. She no longer wears her veil. “You came.” Her voice is almost tender. “I knew you would. You're good, as she was.”","El salón del trono está abierto al cielo. Sobre vosotros el Sol Negro llena medio firmamento, y en su interior algo se mueve: una boca.\n\nAnte el altar, Seraphine sostiene la Llave del Alba. Ya no lleva velo. «Has venido.» Su voz es casi tierna. «Sabía que vendrías. Eres bueno, como lo era ella.»"],
  ch:[
    {t:["«Perché?»","“Why?”","«¿Por qué?»"], req:()=>!has("why"), go:"a3_why"},
    {t:["«Lia.» Parlarle di sua figlia","“Lia.” Speak to her of her daughter","«Lia.» Hablarle de su hija"], req:()=>has("lia_grave"), check:{sk:"pers", dc:15, ok:"a3_redeem", ko:"a3_ser_fight", adv:()=>has("unmasked") || has("sus_ser")}},
    {t:["Attaccare","Attack","Atacar"], fight:"seraphine", win:"a3_ser_down"}]};
SC.a3_why = {bg:"throne", loc:LOC.throne, once(){ set("why"); },
  t:()=>cat(["«Perché il sole l'ha lasciata morire.» Seraphine guarda il disco nero. «Febbre grigia. Sette anni. Ho pregato Aurel per nove notti, e lui ha continuato a sorgere ogni mattina come se niente fosse. Morrhan mi ha promesso che chi divora la luce può restituire ciò che la luce ha preso.»\n\nSolleva la Chiave. «Riavrò mia figlia. E tu mi aiuterai, che tu lo voglia o no.»","“Because the sun let her die.” Seraphine looks at the black disc. “Grey fever. Seven years old. I prayed to Aurel for nine nights, and he kept rising every morning as if nothing had happened. Morrhan promised me that whoever devours the light can give back what the light has taken.”\n\nShe raises the Key. “I will have my daughter back. And you will help me, whether you want to or not.”","«Porque el sol la dejó morir.» Seraphine mira el disco negro. «Fiebre gris. Siete años. Recé a Aurel durante nueve noches, y él siguió saliendo cada mañana como si nada. Morrhan me prometió que quien devora la luz puede devolver lo que la luz se llevó.»\n\nAlza la Llave. «Recuperaré a mi hija. Y tú me ayudarás, quieras o no.»"],
    !has("lia_grave") && ["Ripensi alla cripta di Ashford, alle piccole tombe che non hai guardato. Forse c'era qualcosa da leggere, laggiù.","You think back to the crypt at Ashford, to the small graves you didn't look at. Perhaps there was something to read down there.","Recuerdas la cripta de Ashford, las pequeñas tumbas que no miraste. Quizá había algo que leer allí abajo."]),
  ch:[{t:["Continuare","Go on","Continuar"], go:"a3_throne"}]};
SC.a3_ser_fight = {bg:"throne", loc:LOC.throne,
  t:["Le tue parole la colpiscono, ma non abbastanza. «Non pronunciare il suo nome!» urla, e l'ombra esplode attorno a lei.","Your words strike her, but not deeply enough. “Do not speak her name!” she screams, and shadow explodes around her.","Tus palabras la alcanzan, pero no lo bastante. «¡No pronuncies su nombre!» grita, y la sombra estalla a su alrededor."],
  ch:[{t:["Combattere","Fight","Luchar"], fight:"seraphine", win:"a3_ser_down"}]};
SC.a3_redeem = {bg:"throne", loc:LOC.throne, once(){ set("ser_redeemed"); xp(500); },
  t:["«Lia aveva paura del buio» dici. «Dormiva con una candela accesa, vero? E tu le cantavi della luce. Credi davvero che vorrebbe tornare così? Divorando altri bambini?»\n\nLa Chiave trema nelle mani di Seraphine. Il Sole Nero ruggisce. «Io…» Una lacrima le scende sulla guancia grigia, e dove cade la pelle torna rosa. «Lia. Perdonami.»\n\nSi volta verso il cielo e alza le braccia. Fili d'ombra la avvolgono e la trascinano verso la bocca nel sole. «Vi do il tempo che posso. Uccidetelo mentre lo trattengo!»\n\nDal Sole Nero cade qualcosa: un gigante di fumo e denti, incatenato dalla luce di lei.","“Lia was afraid of the dark,” you say. “She slept with a candle lit, didn't she? And you sang to her about the light. Do you really think she'd want to come back like this? By devouring other children?”\n\nThe Key trembles in Seraphine's hands. The Black Sun roars. “I…” A tear runs down her grey cheek, and where it falls the skin turns pink again. “Lia. Forgive me.”\n\nShe turns to the sky and raises her arms. Threads of shadow wrap around her and drag her toward the mouth in the sun. “I'll give you what time I can. Kill it while I hold it!”\n\nSomething falls from the Black Sun: a giant of smoke and teeth, chained by her light.","«Lia tenía miedo a la oscuridad» dices. «Dormía con una vela encendida, ¿verdad? Y tú le cantabas sobre la luz. ¿De verdad crees que querría volver así? ¿Devorando a otros niños?»\n\nLa Llave tiembla en manos de Seraphine. El Sol Negro ruge. «Yo…» Una lágrima le cae por la mejilla gris, y donde cae la piel vuelve a ser rosada. «Lia. Perdóname.»\n\nSe vuelve hacia el cielo y alza los brazos. Hilos de sombra la envuelven y la arrastran hacia la boca del sol. «Os daré el tiempo que pueda. ¡Matadlo mientras lo retengo!»\n\nDel Sol Negro cae algo: un gigante de humo y dientes, encadenado por su luz."],
  ch:[{t:["Combattere l'Avatar","Fight the Avatar","Luchar contra el Avatar"], fight:"avatar_weak", win:"a3_final"}]};
SC.a3_ser_down = {bg:"throne", loc:LOC.throne,
  t:["Seraphine cade in ginocchio. La Chiave rotola ai tuoi piedi. «Lia…» sussurra.\n\nMa è troppo tardi: il rito è cominciato. Il Sole Nero si apre come un occhio, e da esso cade qualcosa che urla: un gigante di fumo, fame e denti. L'Avatar di Morrhan. Il suo primo pasto è la donna che lo ha chiamato.","Seraphine falls to her knees. The Key rolls to your feet. “Lia…” she whispers.\n\nBut it's too late: the rite has begun. The Black Sun opens like an eye, and from it falls something screaming: a giant of smoke, hunger and teeth. The Avatar of Morrhan. Its first meal is the woman who summoned it.","Seraphine cae de rodillas. La Llave rueda a tus pies. «Lia…» susurra.\n\nPero es demasiado tarde: el rito ha comenzado. El Sol Negro se abre como un ojo, y de él cae algo que grita: un gigante de humo, hambre y dientes. El Avatar de Morrhan. Su primer bocado es la mujer que lo invocó."],

SC.a3_final = {bg:"throne", loc:LOC.throne, once(){ item("key",1); },
  t:()=>cat(["L'Avatar si dissolve in un ululato che fa tremare il picco. Nel silenzio che segue raccogli la Chiave dell'Alba. Il tuo marchio brucia, e capisci tutto in un istante: il sole non è morto. È dentro di te, e negli altri sei, spezzato in sette frammenti. La Chiave può riunirlo.\n\nMa c'è un prezzo. Lo senti. E c'è anche una voce, ancora, dal fondo del buio: «Oppure tieni tutto per te. Saresti un dio.»","The Avatar dissolves in a howl that shakes the peak. In the silence that follows you pick up the Key of Dawn. Your mark burns, and in an instant you understand everything: the sun is not dead. It is inside you, and inside the other six, broken into seven shards. The Key can make it whole.\n\nBut there is a price. You can feel it. And there is also a voice, still, from the depths of the dark: “Or keep it all for yourself. You would be a god.”","El Avatar se disuelve en un aullido que hace temblar el pico. En el silencio que sigue recoges la Llave del Alba. Tu marca arde, y lo comprendes todo en un instante: el sol no ha muerto. Está dentro de ti, y dentro de los otros seis, roto en siete fragmentos. La Llave puede reunirlo.\n\nPero hay un precio. Lo sientes. Y hay también una voz, todavía, desde el fondo de la oscuridad: «O quédatelo todo para ti. Serías un dios.»"],

SC.end_dawn = {bg:"dawn", loc:LOC.throne, once(){ set("game_done"); set("end_dawn"); },
  t:()=>cat(has("ser_redeemed") ?
    ["Giri la Chiave. La luce esce dal tuo marchio come un fiume, e dovrebbe portarti via con sé: lo senti, il prezzo è una vita. Ma una mano grigia, ormai trasparente, si posa sulla tua. Seraphine.\n\n«Lascia. Questo debito è mio.» La luce prende lei al posto tuo, e per un istante vedi una bambina che le corre incontro.\n\nIl Sole Nero si spacca. L'alba sorge sulla Corona di Cenere per la prima volta in quarantaquattro giorni. Brenna piange e ride insieme: lontano, sotto le Montagne Rosse, una forgia si riaccende da sola.","You turn the Key. Light pours from your mark like a river, and it should carry you away with it: you feel it, the price is a life. But a grey hand, now transparent, settles on yours. Seraphine.\n\n“Let go. This debt is mine.” The light takes her instead of you, and for an instant you see a little girl running to meet her.\n\nThe Black Sun cracks. Dawn rises over the Crown of Ash for the first time in forty-four days. Brenna weeps and laughs at once: far away, beneath the Red Mountains, a forge rekindles on its own.","Giras la Llave. La luz brota de tu marca como un río, y debería llevarte consigo: lo sientes, el precio es una vida. Pero una mano gris, ya transparente, se posa sobre la tuya. Seraphine.\n\n«Suelta. Esta deuda es mía.» La luz se la lleva a ella en tu lugar, y por un instante ves a una niña que corre a su encuentro.\n\nEl Sol Negro se resquebraja. El alba se alza sobre la Corona de Ceniza por primera vez en cuarenta y cuatro días. Brenna llora y ríe a la vez: lejos, bajo las Montañas Rojas, una forja vuelve a encenderse sola."] :
    has("freed_branded") ?
    ["Giri la Chiave. La luce esce dal tuo marchio come un fiume, e dovrebbe portarti via con sé. Ma sei mani si posano sulle tue spalle: i marchiati che hai liberato. Ognuno prende una parte del prezzo, e il peso si divide in sette.\n\nCadi in ginocchio, svuotato, vivo. Il Sole Nero si spacca. L'alba sorge sulla Corona di Cenere per la prima volta in quarantaquattro giorni. Brenna piange e ride insieme: lontano, sotto le Montagne Rosse, una forgia si riaccende da sola.","You turn the Key. Light pours from your mark like a river, and it should carry you away. But six hands settle on your shoulders: the marked you freed. Each takes a share of the price, and the weight is divided by seven.\n\nYou fall to your knees, emptied, alive. The Black Sun cracks. Dawn rises over the Crown of Ash for the first time in forty-four days. Brenna weeps and laughs at once: far away, beneath the Red Mountains, a forge rekindles on its own.","Giras la Llave. La luz brota de tu marca como un río, y debería llevarte consigo. Pero seis manos se posan sobre tus hombros: los marcados que liberaste. Cada uno toma una parte del precio, y el peso se divide entre siete.\n\nCaes de rodillas, vaciado, vivo. El Sol Negro se resquebraja. El alba se alza sobre la Corona de Ceniza por primera vez en cuarenta y cuatro días. Brenna llora y ríe a la vez: lejos, bajo las Montañas Rojas, una forja vuelve a encenderse sola."] :
    ["Giri la Chiave. La luce esce dal tuo marchio come un fiume e ti porta via con sé. Non fa male. È come addormentarsi al sole, in un pomeriggio d'estate.\n\nIl Sole Nero si spacca. L'alba sorge sulla Corona di Cenere per la prima volta in quarantaquattro giorni. I tuoi compagni la guardano in silenzio. Tu non ci sei più, ma la luce sì. Ad Ashford, da allora, ogni mattina qualcuno lascia una candela accesa sulla soglia del tempio.","You turn the Key. Light pours from your mark like a river and carries you away with it. It doesn't hurt. It's like falling asleep in the sun on a summer afternoon.\n\nThe Black Sun cracks. Dawn rises over the Crown of Ash for the first time in forty-four days. Your companions watch it in silence. You are gone, but the light remains. In Ashford, ever since, someone leaves a lit candle on the shrine steps every morning.","Giras la Llave. La luz brota de tu marca como un río y te lleva consigo. No duele. Es como quedarse dormido al sol una tarde de verano.\n\nEl Sol Negro se resquebraja. El alba se alza sobre la Corona de Ceniza por primera vez en cuarenta y cuatro días. Tus compañeros la contemplan en silencio. Tú ya no estás, pero la luz sí. En Ashford, desde entonces, cada mañana alguien deja una vela encendida en el umbral del templo."],
    epilogue(),
    ["FINALE: L'ALBA","ENDING: THE DAWN","FINAL: EL ALBA"]),

SC.end_twilight = {bg:"twilight", loc:LOC.throne, once(){ set("game_done"); set("end_twilight"); },
  t:()=>cat(["Spezzi la Chiave sulla pietra dell'altare. Un suono come di vetro, poi un silenzio immenso. Il Sole Nero si sbriciola in polvere. Il marchio sulla tua mano si spegne, e così quelli degli altri sei.\n\nNessun dio sorge: né Aurel, né Morrhan. Solo, lentamente, un sole pallido e normale, che non appartiene a nessuno. Le preghiere, da quel giorno, non ricevono più risposta. Ma nemmeno la fame.\n\nIlyra ride fino alle lacrime. «Un cielo senza padroni. Ne scriverò per altri trecento anni.»","You break the Key on the altar stone. A sound like glass, then an immense silence. The Black Sun crumbles into dust. The mark on your hand goes dark, and so do those of the other six.\n\nNo god rises: neither Aurel nor Morrhan. Only, slowly, a pale and ordinary sun that belongs to no one. From that day, prayers go unanswered. But so does hunger.\n\nIlyra laughs until she cries. “A sky without masters. I'll be writing about it for another three hundred years.”","Rompes la Llave contra la piedra del altar. Un sonido como de cristal, luego un silencio inmenso. El Sol Negro se deshace en polvo. La marca de tu mano se apaga, y también las de los otros seis.\n\nNingún dios se alza: ni Aurel ni Morrhan. Solo, lentamente, un sol pálido y corriente que no pertenece a nadie. Desde ese día, las oraciones no reciben respuesta. Pero el hambre tampoco.\n\nIlyra ríe hasta llorar. «Un cielo sin amos. Escribiré sobre ello otros trescientos años.»"],
    epilogue(),
    ["FINALE: IL CREPUSCOLO LIBERO","ENDING: THE FREE TWILIGHT","FINAL: EL CREPÚSCULO LIBRE"]),
  ch:[{t:["Torna al titolo","Back to title","Volver al título"], end:1}]};

  t:()=>cat(["Lasci entrare la voce. La fame di Morrhan ti riempie, e con la fame arriva il potere: vedi ogni anima della valle come una candela che potresti spegnere con un respiro.\n\nIl Sole Nero non si spezza. Si inchina.\n\nBrenna se ne va senza voltarsi. Gli altri la seguono, uno a uno. Da quel giorno la valle di Valtenebra ha un nuovo signore, che siede su un trono di cenere e non dorme mai. Dicono che nelle notti più lunghe, che ormai sono tutte, lo si senta parlare da solo, con mille voci.",

    ["FINALE: IL RE DI CENERE","ENDING: THE ASH KING","FINAL: EL REY DE CENIZA"]),

/* =================== UTIL =================== */
const $ = (s, r = document) => r.querySelector(s);
const rnd = n => 1 + Math.floor(Math.random() * n);
const mod = s => Math.floor((s - 10) / 2);
const sgn = n => (n >= 0 ? "+" : "") + n;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function roll(expr) {
  if (typeof expr === "number") return {total: expr};
  let total = 0;
  String(expr).replace(/\s/g, "").split(/(?=[+-])/).forEach(part => {
    let sign = 1;
    if (part[0] === "-") { sign = -1; part = part.slice(1); } else if (part[0] === "+") part = part.slice(1);
    const m = part.match(/^(\d*)d(\d+)$/);
    if (m) { const n = +(m[1] || 1), f = +m[2]; for (let i = 0; i < n; i++) total += sign * rnd(f); }
    else total += sign * (+part || 0);
  });
  return {total: Math.max(0, total)};
}
const critDice = e => e.replace(/(\d*)d(\d+)/g, (m, a, b) => (2 * (+(a || 1))) + "d" + b);

/* =================== STATE & STORAGE =================== */
const SAVE_KEY = "ddc-save-v1", PREF_KEY = "ddc-prefs-v1";
let S = null, PREF = {lang: 0, diff: 1}, SCREEN = "title", BUSY = false;
function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
function load(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function saveGame(silent) { if (!S) return; const ok = store(SAVE_KEY, S); if (!silent) toast(ok ? T_("saved") : T_("noStore")); }

/* =================== CHARACTER RULES =================== */
const CL = c => CLASSES[c.cls];
const prof = c => c.lvl >= 5 ? 3 : 2;
const abm = (c, k) => mod(c.ab[k]);
function maxHP(c) { const h = CL(c).hd, con = abm(c, "con"); let hp = h + con + (c.lvl - 1) * (h / 2 + 1 + con); if (c.race === "dwarf") hp += c.lvl; return Math.max(1, hp); }
function acOf(c) { const dex = abm(c, "dex"); const a = CL(c).armor; let ac = a === "heavy" ? 16 : a === "medium" ? 14 + Math.min(dex, 2) : a === "light" ? 11 + dex : 13 + dex; if (CL(c).shield) ac += 2; return ac + (c.aplus || 0); }
const speedOf = c => RACES[c.race].spd;
function slotsMax(c) { const t = CL(c).caster; const tab = t === "full" ? FULL : t === "half" ? HALF : null; return tab ? tab[c.lvl].slice() : [0,0,0,0]; }
const castMod = c => CL(c).cast ? abm(c, CL(c).cast) : 0;
const spellDC = c => 8 + prof(c) + castMod(c);
const spellAtk = c => prof(c) + castMod(c);
function featsOf(c) { const t = CLASS_FEATS[c.cls] || {}, out = []; for (let l = 1; l <= c.lvl; l++) (t[l] || []).forEach(f => { if (!out.includes(f)) out.push(f); }); return out; }
const hasF = (c, f) => featsOf(c).includes(f);
function spellsOf(c) { const t = CL(c).spells || {}, out = []; Object.keys(t).forEach(l => { if (c.lvl >= +l) out.push(...t[l]); }); return out; }
const weaponsOf = c => c.weapons || CL(c).weapons;
const skillBonus = (c, sk) => abm(c, SKILLS[sk][1]) + (c.skills.includes(sk) ? prof(c) : 0);
function auraBonus() { if (!S) return 0; const p = S.party.find(c => c.cls === "paladin" && c.lvl >= 6 && c.hp > 0); return p ? Math.max(1, abm(p, "cha")) : 0; }
const saveBonus = (c, ab) => abm(c, ab) + (CL(c).saves.includes(ab) ? prof(c) : 0) + auraBonus();
function resetRes(c) { c.res = {sw: 1, as: 1, lay: 5 * c.lvl, ch: 1}; }
function recalc(c, full) {
  const m = maxHP(c);
  if (full || c.maxhp == null) c.hp = m; else c.hp = Math.min(m, c.hp + Math.max(0, m - c.maxhp));
  c.maxhp = m;
  if (full) { c.slots = slotsMax(c); resetRes(c); }
}
function asiLevels(c) { const t = CLASS_FEATS[c.cls] || {}; return Object.keys(t).filter(l => t[l].includes("asi")).map(Number); }
function autoASI(c) {
  c.asiDone = c.asiDone || [];
  asiLevels(c).forEach(l => { if (c.lvl >= l && !c.asiDone.includes(l)) { const k = c.ab[CL(c).prim] >= 19 ? "con" : CL(c).prim; c.ab[k] = Math.min(20, c.ab[k] + 2); c.asiDone.push(l); } });
}
function weapProfile(c, wk) {
  const w = WEAP[wk]; const stat = w.st === "fin" ? (abm(c, "str") > abm(c, "dex") ? "str" : "dex") : w.st; const m = abm(c, stat);
  let hit = m + prof(c) + (c.wplus || 0), flat = m + (c.wplus || 0);
  if (w.ranged && hasF(c, "archery")) hit += 2;
  if (!w.ranged && hasF(c, "dueling")) flat += 2;
  return {key: wk, name: tr(w.n), dice: w.d, hit, flat, r: w.r, ranged: !!w.ranged, t: w.t, finesse: w.st === "fin"};
}

  sarco(x, W, H) { x.fillStyle = "#0b0a0f"; x.fillRect(W / 2 - 60, H * .74, 120, H * .26); x.fillStyle = "#1d1b24"; x.fillRect(W / 2 - 64, H * .7, 128, 10); },
  shelves(x, W, H, R) { for (let row = 0; row < 6; row++) { const y = H * (.08 + row * .15); x.fillStyle = "#0e0a07"; x.fillRect(0, y + H * .12, W, 4); let cx = 0; while (cx < W) { const bw = 3 + R() * 6, bh = H * (.07 + R() * .045); x.fillStyle = ["#3b2a1c","#2d2230","#22303a","#4a2f20","#2a3324"][Math.floor(R() * 5)]; x.fillRect(cx, y + H * .12 - bh, bw, bh); cx += bw + 1; } } },
  chandelier(x, W, H) { glow(x, W / 2, H * .2, 90, "rgba(180,130,250,.8)", .7); x.strokeStyle = "#3b2e48"; x.lineWidth = 2; x.beginPath(); x.moveTo(W / 2, 0); x.lineTo(W / 2, H * .15); x.stroke(); x.beginPath(); x.ellipse(W / 2, H * .2, 50, 10, 0, 0, 7); x.stroke(); for (let i = 0; i < 7; i++) { x.fillStyle = "#c9a7ff"; x.fillRect(W / 2 - 45 + i * 15, H * .16, 3, 6); } },

  water(x, W, H, R) { const g = x.createLinearGradient(0, H * .72, 0, H); g.addColorStop(0, "rgba(40,80,90,.5)"); g.addColorStop(1, "rgba(10,20,25,.95)"); x.fillStyle = g; x.fillRect(0, H * .72, W, H * .28); x.strokeStyle = "rgba(160,220,210,.2)"; for (let i = 0; i < 24; i++) { const sx = R() * W, sy = H * (.74 + R() * .24); x.beginPath(); x.moveTo(sx, sy); x.lineTo(sx + 10 + R() * 30, sy); x.stroke(); } },

};
function paint(cv, key) {
  if (!cv) return; const b = BG[key] || BG.road;
  const dpr = Math.min(2, window.devicePixelRatio || 1), W = cv.clientWidth || 360, H = cv.clientHeight || 200;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const x = cv.getContext("2d"); x.setTransform(dpr, 0, 0, dpr, 0, 0);
  let seed = hashStr(key); const R = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  if (b.wall) {
    const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#050407"); g.addColorStop(.6, b.wall); g.addColorStop(1, "#060508"); x.fillStyle = g; x.fillRect(0, 0, W, H);
    glow(x, W * b.gx, H * .7, W * .6, b.glow, .35);
  } else {
    const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, b.sky[0]); g.addColorStop(1, b.sky[1]); x.fillStyle = g; x.fillRect(0, 0, W, H);
    if (!b.gold) for (let i = 0; i < 70; i++) { x.fillStyle = `rgba(235,225,204,${.1 + R() * .5})`; x.fillRect(R() * W, R() * H * .6, 1, 1); }
    if (b.sun) blackSun(x, W * b.sun[0], H * b.sun[1], Math.min(W, H * 1.6) * b.sun[2]);
    if (b.gold) { const [sx, sy, sr] = b.gold, r = Math.min(W, H * 1.6) * sr; glow(x, W * sx, H * sy, r * 4, "rgba(255,210,130,.9)", .9); x.fillStyle = "#ffe2a0"; x.beginPath(); x.arc(W * sx, H * sy, r, 0, 7); x.fill(); }
    if (b.pale) { const [sx, sy, sr] = b.pale, r = Math.min(W, H * 1.6) * sr; glow(x, W * sx, H * sy, r * 3, "rgba(240,225,215,.6)", .7); x.fillStyle = "#efe4da"; x.beginPath(); x.arc(W * sx, H * sy, r, 0, 7); x.fill(); }
  }
  b.L.forEach(l => LY[l] && LY[l](x, W, H, R, b));
  const v = x.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .3, W / 2, H / 2, Math.max(W, H) * .75); v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,.6)"); x.fillStyle = v; x.fillRect(0, 0, W, H);
}

const PB_COST = {8:0,9:1,10:2,11:3,12:4,13:5,14:7,15:9};
let CR = null;
function freshCR() { return {step: 0, name: "", race: "human", cls: "fighter", bg: "soldier", base: {...CLASSES.fighter.rec}}; }
const pbLeft = () => 27 - AB.reduce((s, k) => s + PB_COST[CR.base[k]], 0);
const finalAb = () => { const r = RACES[CR.race].bonus, o = {}; AB.forEach(k => o[k] = CR.base[k] + (r[k] || 0)); return o; };
function crChar() { const skills = [...CLASSES[CR.cls].skills, ...BGS[CR.bg].skills]; if (RACES[CR.race].skill) skills.push(RACES[CR.race].skill); return newChar({id: "pc", name: CR.name.trim() || defaultName(), race: CR.race, cls: CR.cls, bg: CR.bg, ab: finalAb(), skills}); }
function defaultName() { return ["Aren","Selva","Tamsin","Corvo","Ysolde","Dario"][hashStr(CR.race + CR.cls) % 6]; }
function optCards(obj, curKey, attr, iconFn) {

function renderCreate() {

    <div class="lbl" style="margin-bottom:8px">${T_("race")}</div>${optCards(RACES, CR.race, "race", () => "hand")}`;

    <div class="pb">${AB.map(k => `<div class="pbrow"><b>${abS(k)}<small>${abL(k)}${rb[k] ? ` · +${rb[k]}` : ""}</small></b><button data-dn="${k}" aria-label="−">−</button><span class="v">${CR.base[k]}</span><button data-up="${k}" aria-label="+">+</button><span class="f">${fa[k]} (${sgn(mod(fa[k]))})</span></div>`).join("")}</div>`; }

  const R = $("#create");
  R.querySelectorAll("[data-race]").forEach(b => b.onclick = () => { CR.race = b.dataset.race; renderCreate(); });

  R.querySelectorAll("[data-bg]").forEach(b => b.onclick = () => { CR.bg = b.dataset.bg; renderCreate(); });
  R.querySelectorAll("[data-up]").forEach(b => b.onclick = () => { const k = b.dataset.up, v = CR.base[k]; if (v < 15 && PB_COST[v + 1] - PB_COST[v] <= pbLeft()) { CR.base[k]++; renderCreate(); } });
  R.querySelectorAll("[data-dn]").forEach(b => b.onclick = () => { const k = b.dataset.dn; if (CR.base[k] > 8) { CR.base[k]--; renderCreate(); } });

/* =================== STORY RUNNER =================== */
function visibleChoices(sc) { return (sc.ch || []).filter(ch => !ch.req || ch.req()); }
function goScene(id, noOnce) {
  if (typeof id === "function") id = id();
  const sc = SC[id]; if (!sc) { console.error("missing scene", id); return; }
  S.scene = id;
  if (!S.seen[id] && !noOnce) { S.seen[id] = 1; sc.once && sc.once(); }
  S.seen[id] = 1;
  if (!noOnce && sc.enter) sc.enter();
  if (!id.startsWith("end_")) saveGame(true);
  renderStory(); const sc2 = $("#storyScroll"); if (sc2) sc2.scrollTop = 0;
}
function chipsHTML() { return S.party.map(c => { const p = c.hp / c.maxhp; return `<div class="chip"><span class="pt">${icon(CL(c).icon)}</span><span>${esc(c.name.split(" ")[0])}<div class="bar"><i class="${p < .35 ? "lo" : ""}" style="width:${Math.max(0, p * 100)}%"></i></div></span></div>`; }).join(""); }
function isCard(p) { return p.length < 70 && p === p.toUpperCase() && /[A-ZÀ-Ý]/.test(p); }
function choiceTag(ch) {
  if (ch.check) { const c = ch.check; const lab = c.save ? `${tr(["TS","Save","Salv."])} ${abS(c.save)}` : tr(SKILLS[c.sk][0]); return ` <span class="tg">${lab} · ${T_("dc")} ${c.dc}${c.adv && c.adv() ? " · " + T_("adv") : ""}</span>`; }
  if (ch.fight) return ` <span class="tg f">${tr(["Combattimento","Combat","Combate"])}</span>`;
  if (ch.cost) return ` <span class="tg c">${ch.cost} ${T_("gp")}</span>`;
  if (ch.shop) return ` <span class="tg c">${T_("shop")}</span>`;
  return "";
}
function renderStory() {
  showScreen("story"); const sc = SC[S.scene];
  const text = tr(typeof sc.t === "function" ? sc.t() : sc.t).replace(/\{n\}/g, pc().name);
  const paras = text.split("\n\n").map(p => `<p${isCard(p) || /^(ATTO|ACT|ACTO) [IV]+ —/.test(p) ? ' class="act-card"' : ""}>${esc(p)}</p>`).join("");
  const chs = visibleChoices(sc);
  $("#story").innerHTML = `<div class="hud"><div class="chips">${chipsHTML()}</div><span class="gold">${S.gold} ${T_("gp")}</span><button class="iconbtn" id="menuBtn" aria-label="${T_("menu")}">${icon("menu")}</button></div>
    <div class="art"><canvas id="artcv" aria-hidden="true"></canvas><div class="loc">${esc(tr(sc.loc || ""))}</div></div>
    <div class="scroll" id="storyScroll"><div class="prose">${paras}</div><div class="choices">${chs.map((ch, i) => `<button class="choice" data-ch="${i}" ${ch.cost && S.gold < ch.cost ? "disabled" : ""}><span class="n">${i + 1}.</span><span>${esc(tr(ch.t))}${choiceTag(ch)}</span></button>`).join("")}</div></div>`;
  paint($("#artcv"), sc.bg);
  $("#menuBtn").onclick = () => openMenu("party");
  $("#story").querySelectorAll("[data-ch]").forEach(b => b.onclick = () => choose(+b.dataset.ch));
  if (S.pendingLv && S.pendingLv.length) showLevelUp();
}
async function choose(i) {
  if (BUSY) return; const ch = visibleChoices(SC[S.scene])[i]; if (!ch) return;
  if (ch.end) { endGame(); return; }
  if (ch.cost) { if (S.gold < ch.cost) { toast(T_("noGold")); return; } S.gold -= ch.cost; }
  if (ch.fx) ch.fx();
  if (ch.rest) { longRest(); toastQ(UI.rested); }
  if (ch.shop) { renderStory(); openShop(ch.shop); return; }
  if (ch.check) { BUSY = true; const ok = await doCheck(ch.check); BUSY = false; goScene(ok ? ch.check.ok : ch.check.ko); return; }
  if (ch.fight) { const k = typeof ch.fight === "function" ? ch.fight() : ch.fight; startCombat(k, ch.win, !!ch.surprise); return; }
  if (ch.go) goScene(ch.go); else { saveGame(true); renderStory(); }
}
function d20For(c) { let r = rnd(20); if (r === 1 && c.race === "halfling") r = rnd(20); return r; }
function doCheck(spec) {
  return new Promise(res => {

    const sp = opt.sp; logL(`${u.name}: ${tr(sp.n)}`);
    if (sp.save) { const dmg = roll(sp.d).total; for (const p of inArea(t, sp.rad || 0).filter(p => p.side === "p" && !p.down)) { const ok = saveRoll(p, sp.save, sp.dc + (S.diff === 2 ? 1 : S.diff === 0 ? -1 : 0)); await applyDmg(p, ok ? Math.floor(dmg / 2) : dmg, sp.t, u); } }
    else { const dmg = await attackRoll(u, t, {hit: sp.b + atkB, dice: sp.d, type: sp.t, ranged: sp.r > 1}); if (sp.drain && dmg) { u.hp = Math.min(u.maxhp, u.hp + Math.floor(dmg / 2)); floatAt(u, "+" + Math.floor(dmg / 2), "#c9a7ff"); placeTokens(); } }
    return;
  }
  const a = opt.a;
  for (let i = 0; i < (a.k || 1); i++) {
    if (!t || t.down) t = pickTarget(u, a.r); if (!t) break;
    const dmg = await attackRoll(u, t, {hit: a.b + atkB, dice: a.d, type: a.t, ranged: !!a.ranged});
    if (dmg && a.para && !t.down && t.ref.race !== "elf" && !saveRoll(t, "con", a.para)) { t.cond.stun = 1; logL(`${t.name} ${T_("stunned")}`); placeTokens(); }
    if (checkEnd()) return;
  }
}

/* ---------- end of battle ---------- */
function syncBack() { allies().forEach(a => { a.ref.hp = a.down ? 1 : Math.max(1, a.hp); }); }
function winCombat() {
  syncBack(); const gx = CB.xp, gg = CB.gold, win = CB.win;
  const m = modal(`<h2>${T_("victory")}</h2><p>${T_("rewards")}: <b style="color:var(--brass)">+${gx} ${T_("xp")}</b>${gg ? ` · <b style="color:var(--brass)">+${gg} ${T_("gp")}</b>` : ""}</p><button class="btn primary" id="vOk">${T_("goOn")}</button>`, {center: 1, locked: 1});
  m.querySelector("#vOk").onclick = () => { closeModal(); CB = null; S.xp += gx; S.gold += gg; checkLevel(); goScene(win); };
}
function loseCombat() {
  const m = modal(`<h2>${T_("defeat")}</h2><p>${T_("defeatTxt")}</p><div style="display:grid;gap:8px"><button class="btn primary" id="lRetry">${T_("retry")}</button><button class="btn small" id="lTitle">${T_("toTitle")}</button></div>`, {center: 1, locked: 1});
  m.querySelector("#lRetry").onclick = () => { closeModal(); const k = CB.key, w = CB.win, s = CB.surprise; S = JSON.parse(CBSNAP); startCombat(k, w, s); };
  m.querySelector("#lTitle").onclick = () => { closeModal(); CB = null; renderTitle(); };
}

/* ---------- render ---------- */
function renderCombat() {
  if (!CB) return; const u = cur();
  $("#ini").innerHTML = `<span class="rd">${T_("round")} ${CB.round}</span>` + CB.order.map(o => `<span class="ini ${o.side}${o === u ? " cur" : ""}${alive(o) ? "" : " gone"}" title="${esc(o.name)}">${icon(o.icon)}</span>`).join("");
  const mine = u && u.side === "p" && !CB.busy && !CB.ended;
  const sp = mine ? selSpec(u) : null, usable = mine && CB.sel && canUse(u, CB.sel);
  const R = mine && u.mv > 0 ? reachOf(u, u.mv) : null;
  document.querySelectorAll("#board .cell").forEach(cel => {
    const x = +cel.dataset.x, y = +cel.dataset.y, t = unitAt(x, y); let c = "";
    if (mine) {
      if (R && R.has(K(x, y)) && !t) c = "reach";
      if (usable) {
        if (sp.tgt === "enemy" && t && t.side === "e" && t.hp > 0 && dist(u, t) <= sp.r) c = "tgt";
        if (sp.tgt === "ally" && t && t.side === "p" && dist(u, t) <= sp.r) c = "ally";
        if (sp.tgt === "tile" && !t && dist(u, {x, y}) <= sp.r && !CB.ob.has(K(x, y))) c = "path";
        if (sp.tgt === "area" && CB.pend && dist(CB.pend, {x, y}) <= sp.rad) c = "area";
        else if (sp.tgt === "area" && t && t.side === "e" && t.hp > 0 && dist(u, t) <= sp.r && !CB.pend) c = "tgt";
      }
    }
    cel.className = "cell" + (CB.ob.has(K(x, y)) ? " ob" : "") + (c ? " " + c : "");
  });
  placeTokens();
  // panel
  const show = CB.inspect || u;
  if (show) {
    const isP = show.side === "p";
    const slots = isP && show.ref.slots.some(Boolean) ? `<div class="slots">${T_("slotsL")} ${show.ref.slots.map((n, i) => n || slotsMax(show.ref)[i] ? `${i + 1}°:${n}` : "").filter(Boolean).join(" ")}</div>` : "";
    $("#cbp").innerHTML = `<div class="who2"><b>${esc(show.name)}</b><span>${T_("hp")} ${Math.max(0, show.hp)}/${show.maxhp} · ${T_("ac")} ${show.ac}</span>${slots}</div>` +
      (show === u && isP && !CB.ended ? `<div class="pips"><span>${T_("action")} <i class="pip ${u.act > 0 || u.atkLeft > 0 ? "on" : ""}"></i></span><span>${T_("bonus")} <i class="pip b ${u.bon > 0 ? "on" : ""}"></i></span><span>${T_("move")} <b class="mv">${u.mv}</b></span></div>` : "");
  }
  // hint
  let hint = "";
  if (CB.inspect && CB.inspect !== u) hint = "";
  else if (mine) hint = sp && sp.tgt === "area" ? T_("tapArea") : sp && sp.tgt === "tile" ? T_("tapTile") : sp && sp.tgt === "ally" ? T_("allyRange") : T_("tapMove");
  else if (u && u.side === "e" && !CB.ended) hint = T_("enemyTurn") + " · " + u.name;
  $("#hint").textContent = hint;
  // actions
  const A = $("#acts");
  if (!mine) { A.innerHTML = `<button class="act" disabled style="grid-column:1/-1">${u && u.side === "e" ? T_("enemyTurn") : "…"}</button>`; }
  else {
    const c = u.ref, ws = weaponsOf(c), spl = spellsOf(c), its = Object.keys(S.inv).filter(k => S.inv[k] > 0 && (ITEMS[k].use === "heal" || ITEMS[k].use === "throw"));
    let h = ws.map((w, i) => { const p = weapProfile(c, w), s = {k: "w", i}; return `<button class="act ${CB.sel && CB.sel.k === "w" && CB.sel.i === i ? "sel" : ""}" data-w="${i}" ${canUse(u, s) ? "" : "disabled"}>${p.name}<small>${sgn(p.hit)} · ${p.dice}${sgn(p.flat)}${u.atkLeft > 0 ? " · ×" + u.atkLeft : ""}</small></button>`; }).join("");
    if (spl.length) h += `<button class="act ${CB.sel && CB.sel.k === "sp" ? "sel" : ""}" id="aSp">${T_("magic")}<small>${CB.sel && CB.sel.k === "sp" ? tr(SPELLS[CB.sel.key].n) : "…"}</small></button>`;
    h += `<button class="act ${CB.sel && CB.sel.k === "ab" ? "sel" : ""}" id="aAb">${T_("abil2")}<small>${CB.sel && CB.sel.k === "ab" ? tr(ABIL[CB.sel.key].n) : "…"}</small></button>`;
    if (its.length) h += `<button class="act ${CB.sel && CB.sel.k === "it" ? "sel" : ""}" id="aIt">${T_("items")}<small>${its.reduce((s, k) => s + S.inv[k], 0)}</small></button>`;
    h += `<button class="act end" id="aEnd">${T_("endTurn")}</button>`;
    A.innerHTML = h;
    A.querySelectorAll("[data-w]").forEach(b => b.onclick = () => { CB.sel = {k: "w", i: +b.dataset.w}; CB.pend = null; renderCombat(); });
    const bs = $("#aSp"); if (bs) bs.onclick = () => pickSheet(u, "sp");
    $("#aAb").onclick = () => pickSheet(u, "ab");
    const bi = $("#aIt"); if (bi) bi.onclick = () => pickSheet(u, "it");
    $("#aEnd").onclick = () => { if (!CB.busy) endTurn(); };
  }
  const l = $("#cblog"); if (l) l.innerHTML = CB.log.slice(-3).map(x => `<div>${esc(x)}</div>`).join("");
}
function pickSheet(u, kind) {
  const c = u.ref; let rows = "";
  if (kind === "sp") rows = spellsOf(c).map(k => { const sp = SPELLS[k], s = {k: "sp", key: k}, ok = canUse(u, s);
    return `<button class="row" data-pk="${k}" ${ok ? "" : "disabled"} style="width:100%;text-align:left;${ok ? "" : "opacity:.4"}"><span class="t"><b>${tr(sp.n)}</b> <span class="tg" style="margin:0">${sp.lv ? sp.lv + "°" : T_("cantrip")}${sp.bonus ? " · " + T_("bonus") : ""}</span>${sp.ff ? ` <span class="tg f" style="margin:0">${T_("aoeWarn")}</span>` : ""}<small>${tr(sp.d)}</small></span></button>`; }).join("");
  if (kind === "ab") rows = abilitiesOf(u).map(k => { const a = ABIL[k], s = {k: "ab", key: k}, ok = canUse(u, s);
    const extra = k === "lay" ? ` (${T_("pool")} ${c.res.lay})` : k === "smite" && u.cond.smite ? ` (${T_("armed")})` : "";
    return `<button class="row" data-pk="${k}" ${ok ? "" : "disabled"} style="width:100%;text-align:left;${ok ? "" : "opacity:.4"}"><span class="t"><b>${tr(a.n)}${extra}</b> <span class="tg" style="margin:0">${a.cost === "act" ? T_("action") : a.cost === "bon" ? T_("bonus") : T_("free")}</span><small>${tr(a.d)}</small></span></button>`; }).join("");
  if (kind === "it") rows = Object.keys(S.inv).filter(k => S.inv[k] > 0 && (ITEMS[k].use === "heal" || ITEMS[k].use === "throw")).map(k => { const it = ITEMS[k], ok = u.act > 0;
    return `<button class="row" data-pk="${k}" ${ok ? "" : "disabled"} style="width:100%;text-align:left;${ok ? "" : "opacity:.4"}"><span class="t"><b>${tr(it.n)} ×${S.inv[k]}</b><small>${tr(it.d)}</small></span></button>`; }).join("");
  const m = modal(`<h2>${kind === "sp" ? T_("magic") : kind === "ab" ? T_("abil2") : T_("items")}</h2><div class="splist">${rows}</div><button class="btn small" id="pkX" style="margin-top:10px">${T_("cancel")}</button>`);
  m.querySelector("#pkX").onclick = closeModal;
  m.querySelectorAll("[data-pk]").forEach(b => b.onclick = () => {
    const key = b.dataset.pk, s = {k: kind, key}; closeModal(); CB.sel = s; CB.pend = null; CB.inspect = null;
    const spc = selSpec(u, s);
    if (spc.tgt === "none") { execute(u, null); return; }
    if (kind === "it" && spc.tgt === "ally" && allies().filter(a => dist(a, u) <= 1).length === 1) { execute(u, u); return; }
    renderCombat();
  });
}

/* =================== BOOT =================== */
let resizeT = null;
window.addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(() => {
  if (SCREEN === "combat" && CB) sizeBoard(); else if (SCREEN === "story" && S) paint($("#artcv"), SC[S.scene].bg); else if (SCREEN === "title") paint($("#tcv"), "title");
}, 150); });
function boot(data) {
  const p = load(PREF_KEY); if (p) PREF = {...PREF, ...p};
  else { const nl = (navigator.language || "it").slice(0, 2); PREF.lang = nl === "en" ? 1 : nl === "es" ? 2 : 0; }
  setLang(PREF.lang);
  if (data && data.S) { S = data.S; if (data.PREF) PREF = data.PREF; setLang(S.lang ?? PREF.lang); goScene(S.scene, true); return; }
  renderTitle();
}
window.claude?.hot?.snapshot?.(() => ({S: CB ? (CBSNAP ? JSON.parse(CBSNAP) : S) : S, PREF}));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
<script>window.ddcBack=function(){var m=document.querySelectorAll(".modal");if(m.length&&!m[m.length-1].querySelector("#dgo,#vOk,#lRetry,#lvOk,[data-asi]")){m.forEach(function(x){x.remove()});if(typeof SCREEN!=="undefined"&&SCREEN==="story"&&typeof renderStory==="function")renderStory();return true}return false};</script>
