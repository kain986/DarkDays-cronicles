name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Assembla il gioco dai sorgenti (src/ → asset Android + docs/)
        run: node tools/build.mjs --inline-fonts

      - name: Verifica la trama (scene, scelte, capitoli)
        run: node tools/validate-story.mjs

      - name: Simulazione rapida del bilanciamento dei combattimenti
        run: node tools/simulate.mjs --quick

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compila l'APK
        run: gradle assembleRelease --no-daemon

      - name: Rinomina l'APK
        run: cp app/build/outputs/apk/release/app-release.apk DarkDaysChronicles.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DarkDaysChronicles-apk
          path: DarkDaysChronicles.apk

      - name: Serve una nuova release?
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "go=1" >> "$GITHUB_OUTPUT";
          elif [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" != pull_request ]] && ! gh release view "v$VER" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "go=1" >> "$GITHUB_OUTPUT";
          else echo "go=0" >> "$GITHUB_OUTPUT"; fi
          # note di rilascio: la sezione di CHANGELOG.md di questa versione
          awk -v v="## $VER " 'index($0,v)==1{f=1;next} /^## /{f=0} f' CHANGELOG.md > relnotes.md
          cat relnotes.md

      - name: Pubblica la release (nuova versionName su main, oppure tag v*)
        if: steps.rel.outputs.go == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: Dark Days Chronicles ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: relnotes.md
          files: DarkDaysChronicles.apk
