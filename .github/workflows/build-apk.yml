name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Assembla il gioco dai sorgenti (src/ → asset Android + docs/)
        run: node tools/build.mjs --inline-fonts

      - name: Verifica la trama (scene, scelte, capitoli)
        run: node tools/validate-story.mjs

      - name: Simulazione rapida del bilanciamento dei combattimenti
        run: node tools/simulate.mjs --quick

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compila l'APK
        run: gradle assembleRelease --no-daemon

      - name: Rinomina l'APK
        run: cp app/build/outputs/apk/release/app-release.apk DarkDaysChronicles.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DarkDaysChronicles-apk
          path: DarkDaysChronicles.apk

      - name: Pubblica la release (solo sui tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DarkDaysChronicles.apk
          generate_release_notes: true
